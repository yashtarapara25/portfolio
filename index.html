    <!--
      Font loading strategy:
      1. preconnect  → opens the TCP/TLS handshake before the browser needs fonts
      2. <link rel="stylesheet"> with display=swap → non-blocking, no FOUT
      3. Only 4 families (removed Rajdhani + Oxanium — barely used)
         Orbitron: headings  |  Space Grotesk: body  |  JetBrains Mono: code labels  |  Inter: fallback
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Single non-blocking request for all required font families -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
