name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 8 */5 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    name: Ping Supabase to prevent project pausing

    steps:
      - name: Ping Supabase REST API
        env:
          # Support both naming conventions the user might have used
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          echo "🏓 Pinging Supabase at $(date)..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ ERROR: SUPABASE_URL secret is empty or not set."
            echo "Please add a secret named SUPABASE_URL with your Supabase Project URL."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "❌ ERROR: Supabase anon key secret is empty or not set."
            echo "Please add a secret named SUPABASE_ANON_KEY with your Supabase anon/public key."
            exit 1
          fi

          echo "✅ Secrets found. Pinging: $SUPABASE_URL"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/site_settings?limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "📊 Response status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and responding!"
          else
            echo "⚠️ Unexpected status code: $STATUS"
            exit 1
          fi
