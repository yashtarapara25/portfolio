name: Supabase Keep-Alive

on:
  # Run at 08:00 UTC every 5 days (Mon, Sat, Thu, Tue, Sun pattern)
  schedule:
    - cron: "0 8 */5 * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    name: Ping Supabase to prevent project pausing

    steps:
      - name: Ping Supabase REST API
        run: |
          echo "🏓 Pinging Supabase at $(date)..."

          # Simple GET to site_settings table — just needs to return any row
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and responding!"
          else
            echo "⚠️ Unexpected status code: $STATUS"
            exit 1
          fi
